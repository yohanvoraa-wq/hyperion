[project]
name = "hyperion"
version = "0.1.0"
description = "An explainable financial reasoning platform. See docs/01-VISION.md."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "pydantic>=2.13.4",
    "uvicorn[standard]>=0.50.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.5.0",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

# --- ED-004: Engineering Principles -----------------------------------------
# Formatting and linting are enforced by ruff (ED-001's formatter+linter choice).
# Typing is enforced by mypy in strict mode, since module boundaries (ED-005)
# are partly encoded as distinct, non-interchangeable types in backend/models/.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
packages = ["backend"]

# Pydantic v2 ships with inline types but mypy sometimes fails to locate
# them in CI environments. Suppress import errors for these third-party
# packages rather than blocking the quality gate on stub availability.
# FastAPI and Starlette do not ship complete stubs; overrides are required.
[[tool.mypy.overrides]]
module = [
    "pydantic.*",
    "fastapi.*",
    "starlette.*",
    "uvicorn.*",
    "httpx.*",
    "httpx2.*",
]
ignore_missing_imports = true

# FastAPI's @router.post() and @app.exception_handler() decorators do not
# carry sufficient type information for mypy --strict. Disabling
# disallow_untyped_decorators for these two files avoids false positives
# without weakening type safety in the engine or business logic.
[[tool.mypy.overrides]]
module = ["backend.api.routes", "backend.api.errors"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "backend.ingestion.exceptions",
    "backend.ingestion.loader",
    "backend.ingestion.resolver",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
