[project]
name = "hyperion"
version = "0.1.0"
description = "An explainable financial reasoning platform. See docs/01-VISION.md."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "pydantic>=2.13.4",
    "uvicorn[standard]>=0.50.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.5.0",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
packages = ["backend"]

[[tool.mypy.overrides]]
module = [
    "pydantic.*",
    "fastapi.*",
    "starlette.*",
    "uvicorn.*",
    "httpx.*",
    "httpx2.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["backend.api.routes", "backend.api.errors"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "backend.ingestion.exceptions",
    "backend.ingestion.loader",
    "backend.ingestion.resolver",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
