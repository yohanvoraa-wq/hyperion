[project]
name = "hyperion"
version = "0.1.0"
description = "An explainable financial reasoning platform. See docs/01-VISION.md."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

# --- ED-004: Engineering Principles -----------------------------------------
# Formatting and linting are enforced by ruff (ED-001's formatter+linter choice).
# Typing is enforced by mypy in strict mode, since module boundaries (ED-005)
# are partly encoded as distinct, non-interchangeable types in backend/models/.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = [
    "fastapi",
    "fastapi.*",
    "uvicorn",
    "uvicorn.*",
    "starlette",
    "starlette.*",
]
ignore_missing_imports = true
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
